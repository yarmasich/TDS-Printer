# TDS Printer — nginx site. ***MODE B: public domain on HTTPS.***
# This is the shape of the live deployment, https://print.hload.dev.
#
# ===========================================================================
# INSTALL EXACTLY ONE OF THESE TWO FILES
#   deploy/nginx/tds-printer.conf                   MODE A — LAN, :80, IP-gated
#   deploy/nginx/tds-printer-tls.conf  ← this one.  MODE B — public, :443 + HSTS
#
# Both pull their entire body from snippets/tds-printer-app.conf, so this file
# keeps every functional property of the LAN one: 50M bodies for XLSX imports,
# 300s proxy timeouts for long serial print jobs, the tighter /docs allowlist,
# the SPA history-mode fallback, immutable /assets/ caching, no-cache on
# index.html, and the full security-header set on every location and on errors.
# The ONLY differences are the listener, TLS, and the absence of a site-wide
# IP allowlist. Enabling both files fails `nginx -t` on a duplicate
# `upstream tds_api` — deliberately.
# ===========================================================================
#
# ###########################################################################
# OPERATOR CHECKLIST — nothing in this repository can verify the live host.
# Someone has to go and look. Do this on print.hload.dev before trusting it:
#
#  1. IS THE IP ALLOWLIST STILL THERE?
#     The config that was shipped for the LAN gated the whole site with
#     `allow 10.0.0.0/8; … deny all;`. Nobody knows whether that survived the
#     move to a public domain. From an address OUTSIDE your office ranges:
#         curl -s -o /dev/null -w '%{http_code}\n' https://print.hload.dev/
#       403 → an allowlist is still active. Decide: either keep it (and then
#             this file's missing allow/deny is wrong for you — copy the
#             ACCESS CONTROL block from tds-printer.conf back in and edit it),
#             or remove it knowingly after step 2 passes.
#       200 → there is no edge gate. Step 2 is then the ONLY protection.
#     Find out which file is actually live first:
#         nginx -T | grep -n -E 'server_name|deny all|allow ' | less
#
#  2. DOES THE APP HAVE ANY AUTH OF ITS OWN? (read this twice)
#     `require_reader` in server/app/auth_station.py enforces a station-or-admin
#     token ONLY while `stations_required(db)` is true, and that is true only
#     when at least one `Station` row exists. With ZERO provisioned stations the
#     catalogue reads — /api/labels/search, /api/projects, /api/halls,
#     /api/disciplines, /api/reasons, /api/auth-names,
#     /api/printers/{id}/ping — and the operator print path answer ANYONE.
#     That is by design (it keeps a fresh LAN install passwordless), and it is
#     exactly the wrong default on a public domain. Probe it:
#         curl -s -o /dev/null -w '%{http_code}\n' https://print.hload.dev/api/projects
#         curl -s https://print.hload.dev/api/station-auth/status
#       401 / {"required":true}  → stations are provisioned, auth is live.
#       200 / {"required":false} → NO auth. Either provision stations in
#                                  Admin → Stations, or put the IP allowlist
#                                  back, or take the host off the internet.
#     Note the one-way door documented in server/README.md: once the first
#     station is created, anonymous operator printing stays blocked even if
#     every station is later disabled.
#
#  3. ADMIN LOGIN MUST ACTUALLY BE CONFIGURED.
#         curl -s https://print.hload.dev/api/auth/status   → {"configured":true}
#     `false` means ADMIN_USERNAME / ADMIN_PASSWORD / ADMIN_JWT_SECRET are
#     missing from server/.env, the admin panel is unreachable, and you cannot
#     provision the stations that step 2 needs.
#
#  4. IS ANYTHING IN FRONT OF NGINX? (Cloudflare, a tunnel, a load balancer)
#     If yes, $remote_addr is the proxy — the /docs allowlist below gates the
#     wrong address, and uvicorn's X-Forwarded-For handling picks the proxy's
#     last hop, so the per-IP login throttle degrades to a single shared
#     bucket. Fix it with set_real_ip_from / real_ip_header (see below) and
#     re-run step 1's probe. Also confirm $https is "on" here: if TLS is
#     terminated upstream and nginx speaks plain HTTP, the HSTS map below
#     evaluates empty and no HSTS is sent — see the map comment.
#
#  5. CONFIRM THE HEADERS ARRIVED.
#         curl -sI https://print.hload.dev/ | grep -iE 'strict-transport|content-security|x-content-type|x-frame|referrer|permissions'
#         curl -sI https://print.hload.dev/index.html | grep -ci content-security   # must be 1
#         curl -sI https://print.hload.dev/assets/<any>.js | grep -ci content-security   # must be 1
#     The last two are the ones that break: both locations set their own
#     Cache-Control, and nginx drops the inherited add_header list when a
#     location declares one of its own.
#
#  6. HSTS IS A ONE-WAY COMMITMENT.
#     Once a browser sees the header below it will refuse plain HTTP to this
#     host for a year. Only enable it when the certificate renewal is working
#     (`systemctl list-timers | grep certbot`). It is NOT preloaded here, on
#     purpose — see the snippet comment.
# ###########################################################################
#
# Install:
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/nginx/snippets/*.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/tds-printer-tls.conf /etc/nginx/sites-available/tds-printer
#   sudo ln -s /etc/nginx/sites-available/tds-printer /etc/nginx/sites-enabled/
#   sudo certbot certonly --nginx -d print.hload.dev     # or --webroot
#   sudo nginx -t && sudo systemctl reload nginx
#
# `nginx -t` fails until the certificate files below exist — get the cert
# first, or temporarily install MODE A while you do.

upstream tds_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ---- HSTS switch ----------------------------------------------------------
# Used by snippets/tds-printer-headers.conf. The header is emitted only when
# $https is "on", i.e. only on the :443 server below — never on the :80
# redirect, and never at all if you later reuse these snippets on a plain-HTTP
# LAN host. Keeping the decision in one map is what lets both deployment modes
# share the same header snippet.
#
# ⚠ If TLS is terminated by something in front of nginx (Cloudflare, a tunnel)
# and nginx itself speaks HTTP, $https is empty and NO HSTS is sent. In that
# case either set the header at that edge, or map $http_x_forwarded_proto
# instead — and only after set_real_ip_from makes that header trustworthy.
map $https $tds_hsts {
    default "";
    on      "max-age=31536000; includeSubDomains";
}

# ---- :80 → :443 -----------------------------------------------------------
# Only the redirect lives on plain HTTP: no proxying, no static files, so a
# misconfigured client can never reach the API or the label database in the
# clear. ACME http-01 challenges are let through for certbot --webroot.
server {
    listen 80;
    listen [::]:80;
    server_name print.hload.dev;          # EDIT to your domain

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx ≥ 1.25. On older nginx delete this line and use
    # `listen 443 ssl http2;` above instead.
    http2 on;
    server_name print.hload.dev;          # EDIT to your domain

    ssl_certificate     /etc/letsencrypt/live/print.hload.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/print.hload.dev/privkey.pem;

    # If certbot installed its own tuning, prefer it and delete the three
    # lines below:
    #   include /etc/letsencrypt/options-ssl-nginx.conf;
    #   ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:TDS_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ===================== ACCESS CONTROL =====================
    # DELIBERATELY NO SITE-WIDE allow/deny HERE.
    #
    # An IP allowlist is the wrong tool on a public domain: the tablets and
    # laptops that use this app come from arbitrary networks, so the list would
    # either be edited into uselessness or lock out the people who need it.
    # On MODE B the weight is carried by TLS plus app-level authentication:
    #   • Admin and every mutating route: admin JWT (server/app/auth_admin.py).
    #   • Print / Kiosk / cart: station login (server/app/auth_station.py).
    #   • Catalogue reads: `require_reader`, which accepts either token.
    #   • External integrations: X-API-Key on /api/v1/*.
    #
    # ⚠⚠ `require_reader` is conditional. It enforces nothing until at least
    # one `Station` row exists (`stations_required`). On a public host with no
    # provisioned stations, removing the allowlist leaves the label database
    # and the printers open to the entire internet. Run step 2 of the OPERATOR
    # CHECKLIST above and do not skip it. If the answer is "no stations yet",
    # paste the ACCESS CONTROL block from tds-printer.conf in right here until
    # they exist.
    #
    # ⚠ If a CDN / tunnel / reverse proxy sits in front (e.g. Cloudflare),
    # $remote_addr is the proxy, not the real client. The /docs allowlist in
    # the app snippet would then gate the wrong address, and so would anything
    # you add here. Trust the forwarded client IP first:
    #   set_real_ip_from <proxy CIDR>;
    #   real_ip_header X-Forwarded-For;   # or CF-Connecting-IP
    #   real_ip_recursive on;
    # ==========================================================

    # Root, body limit, security headers, /docs, /api, /assets/, SPA fallback.
    include snippets/tds-printer-app.conf;
}
