# TDS Printer — reverse-proxy plumbing for uvicorn, shared by /api, /health,
# /docs and /openapi.json so no copy of it can drift out of step.

proxy_pass http://tds_api;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";

# X-Forwarded-For above is load-bearing, not decoration: the login throttle in
# server/app/login_limits.py keys on `request.client.host`, and the app refuses
# to read forwarded headers itself ("Proxy trust belongs in server config").
# uvicorn closes that gap — proxy_headers defaults to on and
# forwarded_allow_ips defaults to 127.0.0.1, so a request arriving from this
# nginx has its client rewritten to the real address. Without this header every
# tablet on the LAN would share one bucket. If nginx ever moves off the same
# host as uvicorn, set FORWARDED_ALLOW_IPS accordingly or the rewrite stops.

# Prints are sent to the printer synchronously and serially. A whole-cable
# group or a /print-batch of up to 500 labels is one long request, so give it
# room before nginx times out. An XLSX import is the same shape of request.
proxy_connect_timeout 10s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;
