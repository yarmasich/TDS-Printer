# TDS Printer — Content-Security-Policy for the SPA and the JSON API.
#
# This policy was derived from the actual `cd frontend && npm run build`
# output, not from a template. A wrong CSP here does not fail loudly — it
# blanks the PrimeVue dialogs or kills the label previews with nothing but a
# console message. If you change the frontend, re-check the four facts below
# before you change this line.
#
#   script-src 'self'
#       dist/index.html contains exactly one <script> and it has a src:
#       `<script type="module" crossorigin src="/assets/index-*.js">`. There is
#       no inline script and no inline <style> in the built shell, and
#       `grep -E "new Function|eval\(" dist/assets/*.js` finds nothing — Vite
#       ships the runtime-only Vue build, so no 'unsafe-inline' and no
#       'unsafe-eval' are needed. Keep it that way.
#
#   style-src 'self' 'unsafe-inline'
#       'unsafe-inline' is unavoidable, not laziness: PrimeVue's styled mode
#       builds its theme CSS in JavaScript and injects it at runtime —
#       `document.createElement("style")` + `head.appendChild` appear in
#       dist/assets/index-*.js, Admin-*.js and PrintPanel-*.js. PrimeVue can
#       stamp a nonce on those tags (its config takes `csp.nonce`), but
#       frontend/src/main.ts does not set one, and a nonce cannot be minted by
#       nginx for a static, long-cached index.html anyway. Drop 'unsafe-inline'
#       and every Dialog, Drawer and Toast loses its styling.
#
#   img-src 'self' data: blob:  /  manifest-src 'self'
#       Three different preview paths, all of them images:
#         • `self`  — /assets/*, the favicons (/icon.svg, /icon-192.png,
#           /apple-touch-icon.png) and the icons listed in /manifest.json.
#         • `data:` — print/StickerPreview.vue renders <image :href> from the
#           `data:image/png;base64,…` string that GET /api/labels/{id}/preview
#           returns (print/ResultCard.vue even asserts that prefix).
#         • `blob:` — admin/TemplatesSection.vue and admin/QrLabelsSection.vue
#           wrap preview/QR responses in URL.createObjectURL().
#       manifest-src is spelled out rather than left to fall back to
#       default-src: index.html now links /manifest.json for the installable
#       kiosk PWA, and that fallback has a patchy history in shipped browsers.
#
#   font-src 'self'
#       PrimeIcons is self-hosted. frontend/vite.config.ts strips the upstream
#       `@font-face` (its `./fonts/` URLs resolve wrong from /assets/*.css) and
#       src/primeicons-font-face.css re-declares it against /fonts/*; the built
#       CSS references only `url(/fonts/primeicons.woff2)` and
#       `url(/fonts/primeicons.woff)`, both emitted into dist/fonts/. No Google
#       Fonts, no CDN — so no remote font origin belongs here.
#
# Not listed, deliberately:
#   • panduit.com — admin/PrintWorkspace.vue links to the manufacturer guide
#     with a plain <a target="_blank">. A top-level navigation is not a
#     subresource fetch, so no CSP directive governs it and adding panduit.com
#     to img-src/connect-src would only widen the policy for no reason.
#   • worker-src is 'none': there is no `new Worker`, `importScripts` or
#     `serviceWorker` registration anywhere in dist/assets/*.js — the manifest
#     makes the UI installable, it does not add a service worker. The `blob:`
#     above is for <img>, not for workers. Add one and you must widen this.
#   • connect-src is 'self' because the SPA is built with VITE_API_BASE_URL
#     empty and calls relative /api/* (see frontend/src/api/client.ts). If you
#     ever build with VITE_API_BASE_URL pointing at a different host, that
#     origin must be added here or every API call is blocked.
#   • no `upgrade-insecure-requests`: every subresource is already relative, and
#     on the LAN-on-HTTP deployment it would upgrade them to a scheme the host
#     does not serve.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'none'" always;
