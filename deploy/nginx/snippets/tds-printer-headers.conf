# TDS Printer — security response headers, shared by every location.
#
# ---- WHY THIS IS A SEPARATE FILE -------------------------------------------
# `add_header` is NOT inherited into a location that declares an `add_header`
# of its own — nginx replaces the whole inherited list, it does not merge.
# tds-printer-app.conf has three such locations (`/assets/` sets immutable
# caching, `= /index.html` sets no-cache, the Swagger block sets its own CSP),
# so a header written once at server level would silently vanish on exactly
# the responses that carry the app shell. Keeping the set here and `include`-ing
# it from every location means there is one copy to edit and none to forget.
#
# ---- WHY `always` ON EVERY LINE --------------------------------------------
# Without `always`, nginx only emits these on 2xx/3xx. The responses that most
# need them are errors: the 401 from `require_reader`, the 403 from the edge IP
# allowlist, the 413 from an oversized XLSX, the SPA's 404s.
# ---------------------------------------------------------------------------

# Never let a browser re-type a response. /openapi.json, the JSON API and the
# base64 PNG label previews are all served with correct Content-Types;
# sniffing can only ever turn one of them into something executable.
add_header X-Content-Type-Options "nosniff" always;

# Nothing is supposed to embed this UI: the kiosk tablets open it top-level and
# the external app (FloorHub) talks to /api/v1 server-to-server, not in a frame.
# Legacy twin of `frame-ancestors 'none'` in tds-printer-csp.conf — if you ever
# need to embed the kiosk page in a portal you must relax BOTH.
add_header X-Frame-Options "DENY" always;

# Full URL on same-origin requests (handy in the access log when working out
# which SPA route fired an API call), bare origin cross-origin, nothing at all
# on an HTTPS→HTTP downgrade. The UI's single outbound link
# (admin/PrintWorkspace.vue → panduit.com) already carries rel="noreferrer".
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The SPA touches no device APIs — `grep -rE "getUserMedia|navigator\.(usb|
# serial|bluetooth|geolocation)" frontend/src` is empty; printing is server-side
# raw TCP and the RFID reader is a keyboard-emulating wedge. Deny them so a
# compromised dependency cannot start asking a kiosk tablet for its camera.
# `clipboard-write` is deliberately NOT denied: Admin → API keys and Admin →
# Integrations copy freshly issued tokens with navigator.clipboard.writeText().
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# ---- HSTS: emitted ONLY on TLS requests -----------------------------------
# $tds_hsts is mapped from $https in whichever site file is installed
# (tds-printer.conf or tds-printer-tls.conf) and is the empty string on plain
# HTTP; nginx skips an add_header whose value evaluates to empty, so
# nothing is sent. That is the point: HSTS on the LAN-on-HTTP deployment would
# be both wrong and sticky — every tablet that saw it once would refuse plain
# HTTP to a host that has no certificate, for a year, with no way to undo it
# from the server side. Do not hard-code this header.
#
# No `preload`: submitting print.hload.dev to the preload list is effectively
# irreversible and would also commit every sibling host under the parent zone.
add_header Strict-Transport-Security $tds_hsts always;
