# TDS Printer — everything a server block needs except listen/TLS/access
# control. Both site files — tds-printer.conf (MODE A, LAN/HTTP) and
# tds-printer-tls.conf (MODE B, public/HTTPS) — `include` this file, so
# neither can quietly lose the body-size limit, the long print timeouts, the
# /docs allowlist, the SPA fallback or the security headers. If you are adding
# a location, add it HERE, not inside one mode's server block.

# Built SPA. Run `npm run build` in frontend/ and point this at the result.
root /opt/tds-printer/frontend/dist;
index index.html;

# XLSX label imports go through the API — allow a comfortably large body.
# The app enforces its own TDS_IMPORT_MAX_FILE_BYTES (25 MiB) *after* multipart
# parsing, so this is the outer bound that keeps a bogus upload from being
# buffered at all. Keep it above the app limit plus multipart overhead.
client_max_body_size 50M;

# Server-scope headers: these cover responses nginx generates before any
# location matches (a malformed request line, a 413 from the limit above).
# Every location that sets an add_header of its own re-includes them, because
# nginx does not merge inherited and local add_header lists.
include snippets/tds-printer-headers.conf;
include snippets/tds-printer-csp.conf;

# ---- Swagger / OpenAPI: tighter allowlist (admin IPs only) ----------------
# Has its OWN allow/deny, so it does NOT inherit the site-wide list from the
# server block — list every IP that may see the API map here. This stays an IP
# gate in BOTH deployment modes: /docs is an admin tool, and on the public
# domain it is the one place where narrowing by source address is still right.
location ~ ^/(docs|openapi\.json)(/|$) {
    allow 127.0.0.1;
    # allow 198.51.100.10;   # admin workstation — EDIT
    deny all;

    include snippets/tds-printer-proxy.conf;

    # Own add_header set → the server-scope list above does not reach here.
    include snippets/tds-printer-headers.conf;

    # Swagger UI needs its own CSP: FastAPI's get_swagger_ui_html() loads
    # swagger-ui-bundle.js / swagger-ui.css from cdn.jsdelivr.net, bootstraps
    # `SwaggerUIBundle({...})` from an INLINE <script>, and pulls its favicon
    # from fastapi.tiangolo.com. The app policy in tds-printer-csp.conf would
    # render this page blank. Note that two CSP headers are intersected by the
    # browser, never merged, so this location must NOT also include the app
    # policy — the strict one would still win and break the page.
    # Longer-term fix: self-host the swagger-ui-dist assets (FastAPI's
    # swagger_js_url / swagger_css_url arguments) and drop the CDN origins, or
    # turn the docs off in production with FastAPI(docs_url=None).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://cdn.jsdelivr.net https://fastapi.tiangolo.com; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self'" always;
}

# ---- API + health (reverse proxy to uvicorn) ------------------------------
# No allow/deny here → inherits whatever the server block declares (the LAN
# allowlist in mode A, nothing in mode B). No add_header here either, so the
# server-scope headers above DO apply. If you ever add an add_header to this
# location you must re-include both header snippets or the API starts
# answering without nosniff and without a CSP.
location ~ ^/(api|health)(/|$) {
    include snippets/tds-printer-proxy.conf;
}

# ---- Static assets: long cache (Vite fingerprints filenames) --------------
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Own add_header above → re-include, or the JS/CSS bundles would be the
    # only responses on the site with no CSP and no nosniff.
    include snippets/tds-printer-headers.conf;
    include snippets/tds-printer-csp.conf;
    try_files $uri =404;
}

# ---- SPA fallback: history-mode routes (/admin, /kiosk, …) → index.html ----
# No add_header of its own, so the server-scope headers apply. The internal
# redirect to /index.html re-enters location matching and lands in the exact
# match below, which is where the no-cache and the headers come from.
location / {
    try_files $uri $uri/ /index.html;
}

# index.html itself must never be cached, or clients pin to a stale build.
location = /index.html {
    add_header Cache-Control "no-cache";
    # Own add_header above → re-include. This is the app shell; it is the one
    # response where a missing CSP matters most.
    include snippets/tds-printer-headers.conf;
    include snippets/tds-printer-csp.conf;
}

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;
