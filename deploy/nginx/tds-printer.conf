# TDS Printer — production nginx site.
#
# One host serves everything:
#   • the built Vue SPA (frontend/dist) as static files
#   • /api, /docs, /openapi.json, /health → reverse-proxied to uvicorn :8000
#
# Because the SPA and the API share an origin, the frontend calls /api
# directly (build with VITE_API_BASE_URL empty) and no CORS is involved.
#
# Install:
#   sudo cp deploy/nginx/tds-printer.conf /etc/nginx/sites-available/tds-printer
#   sudo ln -s /etc/nginx/sites-available/tds-printer /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream tds_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;            # replace with your hostname / IP, e.g. labels.lan

    # Built SPA. Run `npm run build` in frontend/ and point this at the result.
    root /opt/tds-printer/frontend/dist;
    index index.html;

    # XLSX label imports go through the API — allow a comfortably large body.
    client_max_body_size 50M;

    # ===================== ACCESS CONTROL =====================
    # This app was built for a trusted LAN: several endpoints (POST /api/print,
    # /api/cart/print, GET /api/labels/search, the operator/kiosk pages) have
    # NO app-level auth. On a public domain that means anyone could print to
    # your printers or read the whole label DB. So we gate the WHOLE site to
    # trusted networks at the edge. The operator/kiosk flow stays passwordless
    # *behind* this gate. Inherited by every location that has no allow/deny of
    # its own (i.e. the SPA + /api). EDIT these to your real networks.
    allow 127.0.0.1;
    allow 10.0.0.0/8;          # office / site LAN — EDIT
    allow 192.168.0.0/16;      # LAN — EDIT
    # allow 203.0.113.0/24;    # VPN exit — EDIT
    # allow 198.51.100.7;      # external app (FloorHub) server, for /api/v1 — EDIT
    deny all;
    # ⚠ If a CDN / tunnel / reverse proxy sits in front (e.g. Cloudflare),
    # $remote_addr is the proxy, not the real client — allow/deny would gate the
    # wrong IP. In that case trust the forwarded client IP first:
    #   set_real_ip_from <proxy CIDR>;
    #   real_ip_header X-Forwarded-For;   # or CF-Connecting-IP
    #   real_ip_recursive on;
    # ==========================================================

    # ---- Swagger / OpenAPI: tighter allowlist (admin IPs only) ----
    # Has its OWN allow/deny, so it does NOT inherit the site list above —
    # list every IP that may see the API map here.
    location ~ ^/(docs|openapi\.json)(/|$) {
        allow 127.0.0.1;
        # allow 198.51.100.10;   # admin workstation — EDIT
        deny all;
        proxy_pass http://tds_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ---- API + health (reverse proxy to uvicorn) ----
    # No allow/deny here → inherits the site-wide allowlist above.
    location ~ ^/(api|health)(/|$) {
        proxy_pass http://tds_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Prints are sent to the printer synchronously and serially. A whole-
        # cable group or a /print-batch of up to 500 labels is one long
        # request, so give it room before nginx times out.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ---- Static assets: long cache (Vite fingerprints filenames) ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback: history-mode routes (/admin, /kiosk, …) → index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or clients pin to a stale build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# ---- HTTPS variant (recommended outside a trusted LAN) ----
# Get a cert (e.g. `sudo certbot --nginx -d labels.example.com`) and certbot
# will rewrite the block above to listen on 443 with the lines below. For a
# LAN-only deploy on plain HTTP, the server block above is enough.
#
# server {
#     listen 443 ssl http2;
#     server_name labels.example.com;
#     ssl_certificate     /etc/letsencrypt/live/labels.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/labels.example.com/privkey.pem;
#     ... (same root / locations as above) ...
# }
