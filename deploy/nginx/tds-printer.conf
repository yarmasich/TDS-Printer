# TDS Printer — nginx site. ***MODE A: trusted LAN on plain HTTP.***
#
# ===========================================================================
# INSTALL EXACTLY ONE OF THESE TWO FILES
#   deploy/nginx/tds-printer.conf      ← this one.  MODE A — LAN, :80, IP-gated
#   deploy/nginx/tds-printer-tls.conf               MODE B — public domain,
#                                                   :443 + HSTS, no IP gate
#
# Both are complete, both are valid on their own, and both pull their entire
# body from deploy/nginx/snippets/tds-printer-app.conf — so whichever you pick
# gets the same 50M body limit, the same 300s print timeouts, the same /docs
# allowlist, the same SPA fallback, the same /assets/ caching and the same
# security headers. Nothing is "the same as above" and nothing can be lost by
# copying the wrong half. Enabling both at once fails `nginx -t` on a duplicate
# `upstream tds_api` — that is deliberate: pick one, loudly.
#
# >>> THE LIVE DEPLOYMENT IS CURRENTLY MODE B: https://print.hload.dev.
# >>> This file is therefore NOT what is running in production. Read the
# >>> OPERATOR CHECKLIST at the top of tds-printer-tls.conf before assuming
# >>> anything about that host — in particular whether the IP allowlist that
# >>> used to be the app's only protection is still in place.
# ===========================================================================
#
# One host serves everything:
#   • the built Vue SPA (frontend/dist) as static files
#   • /api, /docs, /openapi.json, /health → reverse-proxied to uvicorn :8000
#
# Because the SPA and the API share an origin, the frontend calls /api
# directly (build with VITE_API_BASE_URL empty) and no CORS is involved.
#
# Install:
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp deploy/nginx/snippets/*.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/tds-printer.conf /etc/nginx/sites-available/tds-printer
#   sudo ln -s /etc/nginx/sites-available/tds-printer /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The `include snippets/…` paths are relative to nginx's prefix (/etc/nginx on
# Debian/Ubuntu), so the snippets MUST be copied too — forgetting them fails
# `nginx -t` rather than silently serving an unprotected site.

upstream tds_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ---- HSTS switch ----------------------------------------------------------
# Used by snippets/tds-printer-headers.conf. $https is "on" only for a request
# that actually arrived over TLS, so on this plain-HTTP site $tds_hsts is empty
# and nginx emits no Strict-Transport-Security at all. That is required, not
# cosmetic: an HSTS header served over HTTP would make every kiosk tablet
# refuse plain HTTP to this host for a year, and you cannot take it back.
map $https $tds_hsts {
    default "";
    on      "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;            # replace with your hostname / IP, e.g. labels.lan

    # ===================== ACCESS CONTROL =====================
    # MODE A assumes a trusted LAN and gates the WHOLE site at the edge.
    #
    # Why the gate still matters even though the app now has auth: the reader
    # guard in server/app/auth_station.py (`require_reader`) only enforces
    # anything once at least one `Station` row exists — see `stations_required`.
    # An install with no provisioned stations is fully open BY DESIGN so that
    # the kiosk flow stays passwordless, which means on such an install this
    # allowlist is the ONLY thing between the public and your label database
    # and your printers. POST /api/print and /api/cart/print behave the same
    # way. Check with:
    #   curl -s -o /dev/null -w '%{http_code}\n' http://<host>/api/projects
    #   → 401 = stations exist, app-level auth is live
    #   → 200 = NO stations provisioned, this allowlist is your whole security
    #
    # Inherited by every location that has no allow/deny of its own (i.e. the
    # SPA + /api + /health). /docs has its own, tighter list in the app
    # snippet. EDIT these to your real networks.
    allow 127.0.0.1;
    allow 10.0.0.0/8;          # office / site LAN — EDIT
    allow 192.168.0.0/16;      # LAN — EDIT
    # allow 203.0.113.0/24;    # VPN exit — EDIT
    # allow 198.51.100.7;      # external app (FloorHub) server, for /api/v1 — EDIT
    deny all;
    # ⚠ If a CDN / tunnel / reverse proxy sits in front (e.g. Cloudflare),
    # $remote_addr is the proxy, not the real client — allow/deny would gate the
    # wrong IP. In that case trust the forwarded client IP first:
    #   set_real_ip_from <proxy CIDR>;
    #   real_ip_header X-Forwarded-For;   # or CF-Connecting-IP
    #   real_ip_recursive on;
    # The same mistake silently breaks the per-IP login throttle, which keys on
    # the address uvicorn derives from X-Forwarded-For.
    # ==========================================================

    # Root, body limit, security headers, /docs, /api, /assets/, SPA fallback.
    include snippets/tds-printer-app.conf;
}
