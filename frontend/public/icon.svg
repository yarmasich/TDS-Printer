<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TDS Printer">
  <title>TDS Printer</title>
  <!-- Wrap-around cable label: sky cable crossing a white printed tag.
       Every feature is >= 1.25px at a 16px render, so the silhouette
       survives the browser tab. -->
  <defs>
    <linearGradient id="tds-tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#312e81" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#tds-tile)" />
  <rect y="28" width="64" height="8" fill="#0284c7" />
  <rect x="16" y="11" width="32" height="42" rx="6" fill="#f8fafc" />
  <rect x="22" y="17" width="20" height="6" rx="3" fill="#0f172a" />
  <rect x="22" y="41" width="20" height="6" rx="3" fill="#0f172a" />
</svg>
