<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Browsers without SVG-favicon support, and iPad home-screen pinning,
         which ignores SVG entirely. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TDS Print" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TDS Printer</title>
    <!-- Resolve the theme before first paint. A tablet woken in a darkened
         data hall must not flash a white screen, and both PrimeVue and the
         token block in style.css key off this one class. Kept in sync with
         `resolveDark()` in stores/theme.ts, which owns it from mount on. -->
    <script>
      try {
        var p = localStorage.getItem("tds-theme");
        if (p === "dark" || (p !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("tds-dark");
        }
      } catch (e) {
        /* storage or matchMedia unavailable — light is the safe default */
      }
    </script>
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
